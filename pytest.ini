[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: Fast unit tests isolated from external systems
    integration: Integration tests exercising database, API, and RAG components
    safety: Clinical safety, emergency escalation, and guardrails verification
    voice: Speech-to-text, audio decoding, and Whisper model tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:huggingface_hub.*
    ignore::UserWarning:whisper.*
